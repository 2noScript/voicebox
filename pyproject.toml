[project]
name = "voicebox"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "transformers>=4.36.0,<=4.57.6",
    "huggingface_hub>=0.20.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0,<2.0",
    "numba>=0.60.0,<0.61.0",
    "pedalboard>=0.9.0",
    "pyloudnorm",
    "httpx>=0.27.0",
    "fastmcp>=3.0,<4.0",
    "sse-starlette>=2.0",
    "starlette>=0.40.0",
    "python-multipart>=0.0.6",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.30.0",
    "miniaudio>=1.59",
    "sounddevice==0.5.3",
    "tiktoken>=0.9.0",
    "mistral-common[audio]",
    "sentencepiece>=0.2.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest>=7.0",
    "pytest-asyncio",
    "pyinstaller",
]

# ---------------------------------------------------------------------------
# Ruff – linter + formatter
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend"]

# Files/dirs to skip entirely.
extend-exclude = [
    "backend/voicebox-server.spec",
    "backend/build_binary.py",
]

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade (modernize syntax for 3.12)
    "B",     # flake8-bugbear
    "A",     # flake8-builtins (shadowing built-in names)
    "SIM",   # flake8-simplify
    "T20",   # flake8-print (flag print() calls)
    "RET",   # flake8-return
    "PIE",   # misc lints
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
    "ERA",   # commented-out code detection
    "FIX",   # flag TODO/FIXME/HACK/XXX for review
]

ignore = [
    "T201",
    "E501",
    "RET504",
    "SIM108",
    "B008",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101", "T201", "PLR2004", "ERA001"]
"backend/**/__init__.py" = ["F401"]
"backend/server.py" = ["T201"]
"backend/main.py" = ["T201"]
"backend/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
